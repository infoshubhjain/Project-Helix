name: Daily Scraper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scraper.yml'
      - 'Project/*.py'
      - 'Project/requirements.txt'
      - 'tests/test_scrape_smoke.py'
  schedule:
    - cron: '7 9 * * *'
      timezone: America/Chicago
  workflow_dispatch:      # Allows manual trigger

concurrency:
  group: scraper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: Project/requirements.txt

      - name: Install dependencies
        run: |
          pip install ruff==0.15.16
          pip install -r Project/requirements.txt

      - name: Lint
        run: ruff check Project/scrape.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - name: Run JS tests
        run: make test-js

      - name: Run Scraper
        run: python Project/scrape.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Project/scraped_events.json Project/food_resources.json
          git commit -m "Update scraped events [skip ci]" || exit 0
          git pull --rebase origin main
          git push
