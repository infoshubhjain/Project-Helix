name: Daily Scraper
run-name: Daily Scraper (${{ github.event.schedule || github.event_name }})

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scraper.yml'
      - 'Project/*.py'
      - 'Project/requirements.txt'
      - 'tests/test_scrape_smoke.py'
  schedule:
    - cron: '7 6 * * *'
      timezone: America/Chicago
    - cron: '7 10 * * *'
      timezone: America/Chicago
  workflow_dispatch:      # Allows manual trigger

concurrency:
  group: scraper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-morning-run:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Check whether a scrape is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" != '7 10 * * *' ]; then
            echo 'go=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          today=$(TZ=America/Chicago date +%F)
          morning_run=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/scraper.yml/runs?event=schedule&per_page=50" 2>/dev/null |
            jq -r --arg day "$today" '.workflow_runs[] | select(.created_at[0:10] == $day and .display_title == "Daily Scraper (7 6 * * *)" and .conclusion == "success") | .id' | head -n 1 || true)
          if [ -n "$morning_run" ]; then
            job_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$morning_run/jobs" 2>/dev/null |
              jq -r '.jobs[] | select(.name == "scrape-and-update") | .id' | head -n 1 || true)
            if [ -n "$job_id" ] && gh api "repos/$GITHUB_REPOSITORY/check-runs/$job_id/annotations" > "$RUNNER_TEMP/annotations.json"; then
              if ! jq -e 'any(.[]; .annotation_level == "warning" and (.title == "Empty scraper source" or .title == "Event cap hit"))' "$RUNNER_TEMP/annotations.json" > /dev/null; then
                echo 'Morning scrape succeeded with no source warnings.'
                echo 'go=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          echo 'Morning scrape missing, failed, or warned; running the 10 AM recovery scrape.'
          echo 'go=true' >> "$GITHUB_OUTPUT"

  scrape-and-update:
    needs: check-morning-run
    if: needs.check-morning-run.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: Project/requirements.txt

      - name: Install dependencies
        run: |
          pip install ruff==0.15.16
          pip install -r Project/requirements.txt

      - name: Lint
        run: ruff check Project/scrape.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'

      - name: Run JS tests
        run: make test-js

      - name: Run Scraper
        run: |
          set -o pipefail
          python Project/scrape.py | tee scraper-output.log

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Project/scraped_events.json Project/food_resources.json
          git commit -m "Update scraped events [skip ci]" || exit 0
          git pull --rebase origin main
          git push

      - name: Report unresolved source failures
        if: github.event_name == 'schedule' && github.event.schedule == '7 10 * * *'
        run: |
          if grep -Eq '^::warning title=(Empty scraper source|Event cap hit)::' scraper-output.log; then
            echo 'The 10 AM recovery scrape still has source warnings; code or upstream repair is needed.'
            exit 1
          fi

      - name: Confirm healthy daily scrape to external monitor
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          HEALTHCHECK_URL: ${{ secrets.DAILY_SCRAPER_HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo 'External heartbeat is not configured.'
            exit 0
          fi
          if grep -Eq '^::warning title=(Empty scraper source|Event cap hit)::' scraper-output.log; then
            echo 'Source warning: withholding success heartbeat.'
            exit 0
          fi
          case "$HEALTHCHECK_URL" in
            https://*) ;;
            *) echo 'Heartbeat URL must use HTTPS.'; exit 1 ;;
          esac
          curl --fail --silent --show-error --max-time 10 --retry 3 --output /dev/null "$HEALTHCHECK_URL"
