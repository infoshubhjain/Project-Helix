# Ruff configuration for Project Helix.
# The scrapers use a deliberate compact one-line style for time/meridiem
# parsing (e.g. `if mer == "pm" and h != 12: h += 12`), so E701 is ignored.
# Pyflakes (F) and the remaining pycodestyle error checks stay enabled.
[lint]
# Pin the rule set explicitly. Without `select`, ruff uses whatever its current
# defaults are, and CI installs ruff unpinned — 0.16.2 widened the defaults
# (UP/BLE/DTZ/TRY/I/FURB) and broke every scheduled run from 2026-07-19 on.
select = ["E4", "E7", "E9", "F"]
ignore = ["E701"]
